toggle_slot:
  name: "Toggle Time Slot"
  description: "Toggles a specific time slot on or off for the 24-hour timer."
  fields:
    entity_id:
      name: "Entity ID"
      description: "The entity ID of the 24-hour timer sensor."
      required: false
      example: "sensor.boiler_boiler"
      selector:
        entity:
          integration: timer_24h
          domain: sensor
    hour:
      name: "Hour"
      description: "The hour of the time slot (0-23)."
      required: true
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      name: "Minute"
      description: "The minute of the time slot (0 or 30)."
      required: true
      selector:
        select:
          options:
            - label: "00"
              value: 0
            - label: "30"
              value: 30

set_slots:
  name: "Set Time Slots"
  description: "Sets multiple time slots at once for the 24-hour timer. Each slot must have 'hour' (0-23), 'minute' (0 or 30), and optionally 'isActive' (boolean, defaults to false)."
  fields:
    entity_id:
      name: "Entity ID"
      description: "The entity ID of the 24-hour timer sensor."
      required: false
      example: "sensor.boiler_boiler"
      selector:
        entity:
          integration: timer_24h
          domain: sensor
    slots:
      name: "Time Slots"
      description: "List of time slots to set. Each slot must have 'hour' (0-23), 'minute' (0 or 30), and optionally 'isActive' (boolean, defaults to false)."
      required: true
      example: '[{"hour": 16, "minute": 0, "isActive": true}, {"hour": 8, "minute": 30, "isActive": false}]'
      selector:
        object:

clear_all:
  name: "Clear All Slots"
  description: "Clears all time slots for the 24-hour timer."
  fields:
    entity_id:
      name: "Entity ID"
      description: "The entity ID of the 24-hour timer sensor."
      required: false
      example: "sensor.boiler_boiler"
      selector:
        entity:
          integration: timer_24h
          domain: sensor

set_enabled:
  name: "Set Enabled"
  description: "Enables or disables the 24-hour timer."
  fields:
    entity_id:
      name: "Entity ID"
      description: "The entity ID of the 24-hour timer sensor."
      required: false
      example: "sensor.boiler_boiler"
      selector:
        entity:
          integration: timer_24h
          domain: sensor
    enabled:
      name: "Enabled"
      description: "Whether the timer should be enabled or disabled."
      required: true
      selector:
        boolean:
