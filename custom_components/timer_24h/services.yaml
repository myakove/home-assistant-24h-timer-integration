toggle_slot:
  name: Toggle Time Slot
  description: Toggles a specific time slot on or off for the 24-hour timer.
  target:
    entity:
      domain: sensor
      integration: timer_24h
  fields:
    hour:
      name: Hour
      description: The hour of the time slot (0-23).
      required: true
      example: 8
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      name: Minute
      description: The minute of the time slot (0 or 30).
      required: true
      example: 0
      selector:
        select:
          options:
            - label: "00"
              value: 0
            - label: "30"
              value: 30

set_slots:
  name: Set Time Slots
  description: Sets multiple time slots at once for the 24-hour timer.
  target:
    entity:
      domain: sensor
      integration: timer_24h
  fields:
    slots:
      name: Time Slots
      description: List of time slots with hour, minute, and isActive properties.
      required: true
      example: '[{"hour": 16, "minute": 0, "isActive": true}]'
      selector:
        object:

clear_all:
  name: Clear All Slots
  description: Clears all time slots for the 24-hour timer.
  target:
    entity:
      domain: sensor
      integration: timer_24h

set_enabled:
  name: Set Enabled
  description: Enables or disables the 24-hour timer.
  target:
    entity:
      domain: sensor
      integration: timer_24h
  fields:
    enabled:
      name: Enabled
      description: Whether the timer should be enabled or disabled.
      required: true
      selector:
        boolean:
